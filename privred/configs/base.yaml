# Paper defaults (privacy-redistribution protocol). Training recipe is the companion's (sg configs/base.yaml);
# weight decay and rho are read from the companion's best_wd.json / best_rho.json, never set here.
dataset: cifar100
data_dir: ../sg/data
companion_dir: ../sg/runs
out_dir: runs
split_seed: 1234
val_frac: 0.1
audit_frac: 0.1
# training recipe (companion, Section 3.2)
epochs: 200
batch_size: 128
lr: 0.1
momentum: 0.9
nesterov: true
crop_pad: 4
eval_batch_size: 512
amp: true
num_workers: 4
knn_k: 20
probe_ref_budget: 0.1
hard_frac: 0.25
# budgets and model sets (Sections 3.4, 3.6, 4.1)
privacy_budgets: [1.0, 0.5]
studyB_budget: 1.0
studyA_conditions: [ce, true_hier, flat_aux, final_hier, subset]
M: 32
M0: 16
MB: 16
K_folds: 5
# attack
alpha: 0.001
alphas: [0.001, 0.01, 0.1]
min_expected_fp: 100
min_ref_per_side: 15
# support features
kernel_t: 0.1
support_eps: 1.0e-6
n_vnn: 50
# deletion
eta: 0.04
Q: 4
Q_true_hier: 2
cohort_seed: 0
membership_seed: 0
dv_tol: 0.05
dv_max_swaps: 10000
# Study A subset
n_subset_random: 4
n_subset_spectrum: 4
spectrum_percentiles: [10, 37, 63, 90]
pattern_tol_r: 0.0
pattern_tol_pd: 0.0
# prediction and statistics
top_frac: 0.05
ridge_alphas: [1.0e-3, 3.1623e-3, 1.0e-2, 3.1623e-2, 1.0e-1, 3.1623e-1, 1.0, 3.1623, 10.0, 31.623, 100.0, 316.23, 1000.0]
inner_folds: 3
n_boot: 2000
alpha_family: 0.05
# misc
limit_audit_per_class: null
ece_bins: 15
keep_models: false
gpu_h_per_20k: 0.35   # assumption (Table compute); replace with pilot compute.json
